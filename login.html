<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to ResolveOne — Enterprise AI Support Platform.">
  <meta name="color-scheme" content="light dark">
  <title>Sign In — ResolveOne</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23B65A12'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='15' font-weight='800' fill='%23fff' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css?v=7">
  <link rel="stylesheet" href="css/base.css?v=7">
  <link rel="stylesheet" href="css/components/login.css?v=7">
  <script src="https://unpkg.com/lucide@0.475.0/dist/umd/lucide.js"></script>
</head>
<body>
<script>(function(){var k='rs-theme',t=localStorage.getItem(k)||'light';if(t==='system')t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';if(t==='dark')document.body.classList.add('dark-theme');requestAnimationFrame(function(){document.documentElement.classList.add('transitions-enabled')})})();</script>
  <main class="login-page">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo" aria-hidden="true">R</div>
        <h1 class="login-title">Welcome back</h1>
        <p class="login-subtitle">Sign in to your ResolveOne account</p>
      </div>

      <form class="login-form" data-login-form novalidate>
        <div class="field-group">
          <label class="field-label" for="login-email">Email</label>
          <input type="email" id="login-email" class="field-input" placeholder="you@company.com" required autocomplete="email" inputmode="email" data-login-email>
        </div>

        <div class="field-group">
          <label class="field-label" for="login-password">Password</label>
          <div class="login-password-wrap">
            <input type="password" id="login-password" class="field-input" placeholder="Enter your password" required autocomplete="current-password" data-login-password>
            <button type="button" class="login-password-toggle" data-password-toggle aria-label="Toggle password visibility" tabindex="-1">
              <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-eye-icon><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-eye-off-icon style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <div class="login-options">
          <label class="login-checkbox">
            <input type="checkbox" data-login-remember>
            <span class="login-checkbox-mark"></span>
            <span class="login-checkbox-label">Remember me</span>
          </label>
          <a href="#" class="login-forgot-link" data-login-forgot tabindex="0">Forgot password?</a>
        </div>

        <button type="submit" class="login-btn" data-login-btn>
          <span class="login-btn-content" data-login-btn-content>
            <i data-lucide="log-in" width="17" height="17" style="width:17px;height:17px;"></i>
            Sign In
          </span>
          <span class="login-btn-loader" data-login-btn-loader>
            <svg class="login-spinner" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="31.4 31.4" stroke-linecap="round"/></svg>
            Signing in...
          </span>
        </button>
      </form>

      <div class="login-error" data-login-error style="display:none;" role="alert">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        <span data-login-error-text></span>
      </div>

      <div class="login-server-error" data-login-server-error style="display:none;" role="alert">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
        <div>
          <strong>Unable to connect</strong>
          <p data-login-server-error-text>The server is not responding. Please check your connection and try again.</p>
        </div>
      </div>

      <div class="login-footer">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span>Secure enterprise login</span>
      </div>
      <div class="login-signup-link">
        Don&rsquo;t have an account? <a href="register.html">Create one</a>
      </div>
    </div>
  </main>
  <script src="js/modules/session.js"></script>
  <script src="js/modules/login.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      lucide.createIcons();
      if (window.LoginModule) window.LoginModule.init();
    });
  </script>
</body>
</html>
